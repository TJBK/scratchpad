name: Release

# main -> versioned release (vX.Y.Z, marked latest). The patch number bumps automatically
#         past the latest release; raise module.json's version by hand for a minor or major bump.
# dev  -> rolling "dev" prerelease, replaced on every push
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

# Back-to-back main pushes must not both pick the same next version.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # A manual run from any other branch would otherwise publish over the dev release.
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test tests/*.mjs

      - name: Set release info
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version module.json)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            LATEST=$(gh release list --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
              | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V | tail -n 1)
            # module.json not ahead of the latest release: next patch after that release.
            if [ -n "$LATEST" ] && [ "$(printf '%s\n' "$VERSION" "$LATEST" | sort -V | tail -n 1)" = "$LATEST" ]; then
              IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
            TAG="v$VERSION"
            MANIFEST="$BASE/latest/download/module.json"
          else
            TAG="dev"
            VERSION="$VERSION-dev.$GITHUB_RUN_NUMBER"
            MANIFEST="$BASE/download/dev/module.json"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "download=$BASE/download/$TAG/module.zip" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          jq --arg v "${{ steps.info.outputs.version }}" \
             --arg m "${{ steps.info.outputs.manifest }}" \
             --arg d "${{ steps.info.outputs.download }}" \
             --arg u "https://github.com/${GITHUB_REPOSITORY}" \
             '.version=$v | .manifest=$m | .download=$d | .url=$u' module.json > module.tmp
          mv module.tmp module.json
          zip -r module.zip module.json src styles lang

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if [ "$TAG" = "dev" ]; then
            gh release delete dev --cleanup-tag --yes 2>/dev/null || true
            gh release create dev module.json module.zip --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Dev build ${{ steps.info.outputs.version }}" --notes "Latest dev branch build."
          else
            gh release create "$TAG" module.json module.zip --target "$GITHUB_SHA" \
              --latest --title "$TAG" --generate-notes
          fi
